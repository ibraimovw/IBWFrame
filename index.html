<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBWFrame — Фильмы, сериалы и трейлеры</title>
  <meta name="description" content="IBWFrame — современная платформа поиска фильмов, сериалов, актёров, трейлеров и управления личным списком просмотра." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="/" class="brand" data-link>
        <span class="brand-badge">IBW</span>
        <span class="brand-text">Frame</span>
      </a>

      <nav class="nav-links" aria-label="Основная навигация">
        <a href="/" class="nav-link active" data-route="home" data-link>Главная</a>
        <a href="/movies" class="nav-link" data-route="movies" data-link>Фильмы</a>
        <a href="/tv" class="nav-link" data-route="tv" data-link>Сериалы</a>
        <a href="/watchlist" class="nav-link" data-route="watchlist" data-link>
          Избранное <span class="badge-count" id="watchlistCount">0</span>
        </a>
      </nav>

      <div class="nav-actions">
        <form class="search-form" id="searchForm" role="search">
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Поиск фильмов, сериалов, актёров..."
            autocomplete="off"
            aria-label="Поиск"
          />
          <button type="submit" class="search-btn" aria-label="Найти">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </form>

        <button class="lang-toggle" id="langToggle" title="Переключить язык каталога">RU</button>
      </div>
    </div>
  </header>

  <main id="app" class="main-content"></main>

  <!-- Модальное окно трейлера -->
  <div class="modal" id="trailerModal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-video">
      <button class="modal-close" data-close-modal aria-label="Закрыть">&times;</button>
      <div class="video-wrapper" id="trailerContainer"></div>
    </div>
  </div>

  <!-- Toast уведомления -->
  <div class="toast-container" id="toastContainer"></div>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <div class="brand">
          <span class="brand-badge">IBW</span>
          <span class="brand-text">Frame</span>
        </div>
        <p class="footer-desc">
          Международный каталог кино и сериалов. Все запросы защищены через серверный прокси.
        </p>
      </div>
      <div class="tmdb-attribution">
        <div class="tmdb-logo-box">TMDB</div>
        <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
